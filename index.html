<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#1769aa">

  <title>食券OCR登録</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">

  <script
    src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"
    defer
  ></script>

  <script src="app.js" defer></script>
</head>

<body>
  <main class="container">

    <h1>食券OCR登録</h1>

    <p class="description">
      半券を1枚ずつ撮影してください。
    </p>

    <section class="card">

      <label for="ticketImage" class="camera-button">
        半券を撮影する
      </label>

      <input
        id="ticketImage"
        type="file"
        accept="image/*"
        capture="environment"
      >

      <img
        id="preview"
        class="preview hidden"
        alt="撮影した半券"
      >

      <button
        id="ocrButton"
        type="button"
        disabled
      >
        文字を読み取る
      </button>

      <div id="progressArea" class="hidden">
        <p id="progressText">読み取り準備中...</p>
        <progress id="progressBar" value="0" max="1"></progress>
      </div>

    </section>

    <section class="card">

      <h2>読み取り結果</h2>

      <label for="ticketDate">日付</label>
      <input
        id="ticketDate"
        type="text"
        placeholder="20.10.24"
      >

      <label for="ticketNumber">通し番号</label>
      <input
        id="ticketNumber"
        type="number"
        placeholder="413"
      >

      <label for="ticketTime">購入時間</label>
      <input
        id="ticketTime"
        type="time"
      >

      <label for="ticketPrice">価格</label>
      <div class="price-row">
        <input
          id="ticketPrice"
          type="number"
          min="0"
          step="10"
          placeholder="690"
        >
        <span>円</span>
      </div>

      <div class="result-box">
        還元予定額：
        <strong>
          <span id="refundAmount">0</span>円
        </strong>
      </div>

      <button
        id="saveButton"
        type="button"
      >
        登録する
      </button>

      <p id="message" aria-live="polite"></p>

    </section>

    <section class="card">

      <div class="history-title">
        <h2>登録履歴</h2>

        <button
          id="csvButton"
          type="button"
          class="secondary"
        >
          CSV出力
        </button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>日付</th>
              <th>番号</th>
              <th>時間</th>
              <th>価格</th>
              <th>還元額</th>
              <th></th>
            </tr>
          </thead>

          <tbody id="historyBody">
          </tbody>
        </table>
      </div>

    </section>

    <details class="card">
      <summary>OCRで認識された全文</summary>
      <pre id="rawText"></pre>
    </details>

  </main>
</body>
</html>
